AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: jstimpson-server SAM stack (Go on Lambda + MongoDB + Strava updater)

Parameters:
  StravaClientId:
    Type: String
  StravaClientSecret:
    Type: String
  DbName:
    Type: String
  DbUri:
    Type: String

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Runtime: provided.al2023
    Architectures:
      - arm64
    Environment:
      Variables:
        STRAVA_CLIENT_ID: !Ref StravaClientId
        STRAVA_CLIENT_SECRET: !Ref StravaClientSecret
        DB_NAME: !Ref DbName
        DB_URI: !Ref DbUri

Resources:
  # ----------------------
  # API entrypoint (SAM makefile builder compiles the Go binary via `make build-FastApiFunction`)
  # NOTE: keep the original logical ID (FastApiFunction) so CloudFormation updates the
  # existing function in place; renaming it would trip NAME_CONFLICT_VALIDATION because
  # the FunctionName jstimpson-server-api already exists under the old logical ID.
  # ----------------------
  FastApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: jstimpson-server-api
      CodeUri: .
      Handler: bootstrap
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: "Allow"
              Action:
                - "ssm:GetParameters"
                - "ssm:GetParameter"
                - "ssm:GetParametersByPath"
              Resource:
                - "arn:aws:ssm:us-east-1:343647980472:parameter/jstimpson-server/*"
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: GET
            ApiId: !Ref ApiGateway

  ApiGateway:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET

  # ----------------------
  # Lambda: Strava activities updater (daily backfill into MongoDB)
  # ----------------------
  DbActivitiesUpdaterFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: jstimpson-server-db-activities-updater
      CodeUri: .
      Handler: bootstrap
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: "Allow"
              Action:
                - "ssm:GetParameters"
                - "ssm:GetParameter"
                - "ssm:GetParametersByPath"
              Resource:
                - "arn:aws:ssm:us-east-1:343647980472:parameter/jstimpson-server/*"
      Events:
        Schedule:
          Type: Schedule
          Properties:
            # Update once a day at midnight UTC
            Schedule: "cron(0 0 * * ? *)"

Outputs:
  ApiUrl:
    Description: "API Gateway URL"
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com"

  ApiFunctionArn:
    Description: "API Lambda function ARN"
    Value: !GetAtt FastApiFunction.Arn
