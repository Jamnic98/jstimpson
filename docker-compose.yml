services:
  client:
    container_name: jstimpson-client
    build:
      context: ./client
      dockerfile: ./Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://server:8080
      NEXT_PUBLIC_SERVER_URL: http://server:8080
      SERVER_API_KEY: dev-api-key
      LOGS_ACCESS_TOKEN: dev-access-token
    depends_on:
      - server

  server:
    container_name: jstimpson-server
    build:
      context: ./server
      dockerfile: ./Dockerfile
    ports:
      - "8080:8080"
    environment:
      API_KEY: dev-api-key
      DB_URI: mongodb://mongo:27017

  mongo:
    image: mongo
    ports:
      - "27017:27017"
